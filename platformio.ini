; ESP32-S3 AI MP4 Player + E-Book Reader
; Waveshare ESP32-S3 Touch LCD 3.5"

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

; PSRAM 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Display pins (ST7796)
    -DSCREEN_WIDTH=480
    -DSCREEN_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=9
    -DTFT_BL=27
    ; Touch pins (CST816S)
    -DTOUCH_SDA=6
    -DTOUCH_SCL=5
    -DTOUCH_INT=4
    -DTOUCH_RST=-1
    ; I2S Audio
    -DI2S_BCK=17
    -DI2S_WS=47
    -DI2S_DOUT=15
    -DI2S_DIN=16
    -DI2S_PORT=I2S_NUM_0
    ; SD Card
    -DSD_CS=38
    -DSD_MOSI=11
    -DSD_MISO=13
    -DSD_SCLK=12
    ; Speaker amp
    -DAMP_ENABLE=38

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.4.0
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.0
    ; Audio
    ; ESP8266Audio will be installed separately

build_src_filter = +<*> -<.git/> -<.svn/>
